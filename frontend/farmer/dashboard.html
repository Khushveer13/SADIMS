<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADIMS - Farmer Dashboard</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Persistent Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div
                    style="width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                    <i data-lucide="sprout"></i>
                </div>
                <h2>SADIMS</h2>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item active">
                    <i data-lucide="layout-dashboard"></i>
                    <span>My Fields</span>
                </a>
                <a href="disease.html" class="nav-item">
                    <i data-lucide="scan"></i>
                    <span>Scan Crop</span>
                </a>
                <a href="weather.html" class="nav-item">
                    <i data-lucide="cloud-sun"></i>
                    <span>Weather Logic</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <span>My Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="nav-item" style="color: #FF8585;">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="page-title">
                    <h2>Farmer Dashboard</h2>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 0.9rem; font-weight: 500;">Welcome, <span id="userName">Farmer</span></span>
                    <div
                        style="width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--primary); border: 2px solid var(--accent);">
                        <i data-lucide="user"></i>
                    </div>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="sd-card stat-card">
                    <div class="stat-icon"><i data-lucide="map-pin"></i></div>
                    <div class="stat-info">
                        <div class="label">Total Fields</div>
                        <div class="value" id="totalFieldsCnt">0</div>
                    </div>
                </div>
                <div class="sd-card stat-card">
                    <div class="stat-icon" style="background: rgba(221, 161, 94, 0.15); color: #DDA15E;"><i
                            data-lucide="activity"></i></div>
                    <div class="stat-info">
                        <div class="label">Health Checks</div>
                        <div class="value" id="totalChecksCnt">0</div>
                    </div>
                </div>
                <div class="sd-card stat-card">
                    <div class="stat-icon" style="background: rgba(116, 198, 157, 0.15); color: #2D6A4F;"><i
                            data-lucide="cloud-rain"></i></div>
                    <div class="stat-info">
                        <div class="label">Status</div>
                        <div class="value">Active</div>
                    </div>
                </div>
            </div>

            <div style="padding: 0 2rem 2rem 2rem;" class="p-4">
                <div class="sd-card mb-4">
                    <h3 class="heading-font mb-4" style="font-size: 1.25rem;">Register New Farm</h3>
                    <form id="addFarmForm"
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Location</label>
                            <input type="text" id="location" class="sd-input" placeholder="e.g. Jaipur" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Crop Type</label>
                            <input type="text" id="crop" class="sd-input" placeholder="e.g. Wheat" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Soil Type</label>
                            <input type="text" id="soil" class="sd-input" placeholder="e.g. Loamy" required>
                        </div>
                        <div style="display: flex; align-items: flex-end;">
                            <button type="submit" class="sd-btn sd-btn-primary" style="width: 100%;">Add Farm</button>
                        </div>
                    </form>
                </div>

                <div class="section-header"
                    style="margin-top: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <h3 class="heading-font">My Field Inventory</h3>
                    <button class="sd-btn"
                        style="background: var(--bg-white); border: 1px solid var(--border-color); font-size: 0.8rem;">
                        <i data-lucide="sliders-horizontal" style="width: 14px;"></i> Filter
                    </button>
                </div>

                <div id="farmsList" class="dashboard-grid" style="padding: 1.5rem 0;">
                    <div class="sd-card text-center p-4">
                        <p style="color: var(--text-muted);">Syncing your fields...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../services/api.js"></script>
    <script src="dashboard.js"></script>
    <script>
        lucide.createIcons();
        function logout() {
            localStorage.removeItem('user');
            window.location.href = '../auth/login.html';
        }
    </script>
</body>

</html>
