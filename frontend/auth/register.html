<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADIMS - Create Account</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Cyber Backdrop Grid & Scanline */
        .cyber-grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .cyber-grid {
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
        }
        .cyber-scanline {
            width: 100%;
            height: 4px;
            background: linear-gradient(to bottom, rgba(16, 185, 129, 0), rgba(16, 185, 129, 0.15) 50%, rgba(16, 185, 129, 0));
            position: absolute;
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            from { top: -100px; }
            to { top: 100%; }
        }

        /* Cyber Background & Leaf Backdrop override */
        .auth-wrapper {
            background: radial-gradient(circle at center, rgba(11, 15, 25, 0.45) 0%, rgba(11, 15, 25, 0.92) 100%), 
                        url('../assets/img/auth_cyber_bg.png') no-repeat center center !important;
            background-size: cover !important;
            background-attachment: fixed !important;
        }

        /* Elevating Card Visual Identity with Water Glass Transparency */
        .auth-box .sd-card {
            background: rgba(10, 15, 26, 0.45) !important;
            backdrop-filter: blur(28px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(200%) !important;
            border: 1px solid rgba(16, 185, 129, 0.25) !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 
                        inset 0 0 25px rgba(16, 185, 129, 0.04), 
                        0 0 40px rgba(16, 185, 129, 0.05) !important;
            padding: 2.5rem !important;
            border-radius: 16px !important;
            position: relative;
            overflow: visible;
        }
        .auth-box .sd-card:hover {
            border-color: rgba(16, 185, 129, 0.5) !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(16, 185, 129, 0.15), 
                        inset 0 0 25px rgba(16, 185, 129, 0.08) !important;
            background: rgba(10, 15, 26, 0.5) !important;
        }


        /* Cyber Corner Bracket Decorations */
        .cyber-corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--neon-green);
            border-style: solid;
            pointer-events: none;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }
        
        .auth-box .sd-card:hover .cyber-corner {
            filter: drop-shadow(0 0 4px var(--neon-green));
            opacity: 1;
        }

        /* Futuristic Auth Header Logo */
        .auth-logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .auth-logo-icon {
            width: 48px;
            height: 48px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            from {
                box-shadow: 0 0 10px rgba(16, 185, 129, 0.1), inset 0 0 5px rgba(16, 185, 129, 0.05);
                border-color: rgba(16, 185, 129, 0.25);
            }
            to {
                box-shadow: 0 0 25px rgba(16, 185, 129, 0.35), inset 0 0 10px rgba(16, 185, 129, 0.15);
                border-color: var(--neon-green);
            }
        }

        .auth-header h1 {
            font-size: 2.5rem !important;
            font-weight: 800;
            letter-spacing: 2px !important;
            background: linear-gradient(135deg, #FFF 30%, var(--neon-green) 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            margin-bottom: 0.25rem !important;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.15));
        }

        /* Cyber-HUD Input Fields */
        .input-hud-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .input-hud-icon {
            position: absolute;
            left: 1.15rem;
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .input-hud-field {
            padding-left: 2.75rem !important;
            background: rgba(10, 15, 26, 0.6) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }
        .input-hud-field:focus {
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2) !important;
            background: rgba(10, 15, 26, 0.85) !important;
        }
        .input-hud-container:focus-within .input-hud-icon {
            color: var(--neon-green);
            filter: drop-shadow(0 0 5px var(--neon-green-glow));
        }

        /* Button Hover Glint Interaction */
        .sd-btn-primary {
            position: relative;
            overflow: hidden;
            font-weight: 700 !important;
            letter-spacing: 0.5px;
        }
        .sd-btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
        }
        .sd-btn-primary:hover::after {
            left: 150%;
            transition: 0.75s;
        }

        /* High-Tech Social Login HUD */
        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0 1rem 0;
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.8;
        }
        .social-divider::before, .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
        }
        .social-divider:not(:empty)::before {
            margin-right: .75rem;
        }
        .social-divider:not(:empty)::after {
            margin-left: .75rem;
        }
        .social-auth-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .social-btn {
            padding: 0.75rem 1rem !important;
            background: rgba(255, 255, 255, 0.02) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-main);
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            cursor: pointer;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.06) !important;
            transform: translateY(-1.5px);
        }
        .social-btn.btn-google:hover {
            border-color: rgba(234, 67, 53, 0.35) !important;
            box-shadow: 0 0 12px rgba(234, 67, 53, 0.15);
        }
        .social-btn.btn-facebook:hover {
            border-color: rgba(24, 119, 242, 0.35) !important;
            box-shadow: 0 0 12px rgba(24, 119, 242, 0.15);
        }
        .social-icon {
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .social-btn:hover .social-icon {
            transform: scale(1.08);
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <!-- Tech grid overlays -->
        <div class="cyber-grid-container">
            <div class="cyber-grid"></div>
            <div class="cyber-scanline"></div>
        </div>

        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo-container">
                    <div class="auth-logo-icon">
                        <i data-lucide="leaf"></i>
                    </div>
                </div>
                <h1>SADIMS</h1>
                <p>Smart Agriculture & Disease Management</p>
            </div>

            <div class="sd-card">
                <!-- Tech Corners -->
                <div class="cyber-corner corner-tl"></div>
                <div class="cyber-corner corner-tr"></div>
                <div class="cyber-corner corner-bl"></div>
                <div class="cyber-corner corner-br"></div>

                <h3 class="mb-4 text-center" style="font-size: 1.5rem; color: #fff; font-weight: 700; letter-spacing: 0.5px;">Create Account</h3>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <div class="input-hud-container">
                            <i data-lucide="user" class="input-hud-icon"></i>
                            <input type="text" id="name" class="sd-input input-hud-field" required placeholder="Enter full name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="mobile">Mobile Number</label>
                        <div class="input-hud-container">
                            <i data-lucide="phone" class="input-hud-icon"></i>
                            <input type="text" id="mobile" class="sd-input input-hud-field" required placeholder="Enter mobile number">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-hud-container">
                            <i data-lucide="lock" class="input-hud-icon"></i>
                            <input type="password" id="password" class="sd-input input-hud-field" required placeholder="Create password">
                        </div>
                    </div>

                    <button type="submit" class="sd-btn sd-btn-primary" style="width: 100%; margin-top: 1.5rem;">
                        Register Now
                    </button>

                    <div class="social-divider">
                        <span>Secure Unified Port Auth</span>
                    </div>

                    <div class="social-auth-group">
                        <button type="button" class="social-btn btn-google" onclick="handleSocialLogin('Google')">
                            <svg class="social-icon" viewBox="0 0 24 24" width="16" height="16">
                                <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.61 14.98 1 12 1 7.35 1 3.39 3.67 1.48 7.56l3.86 3C6.27 7.59 8.87 5.04 12 5.04z"/>
                                <path fill="#4285F4" d="M23.45 12.27c0-.82-.07-1.61-.21-2.38H12v4.51h6.43c-.28 1.46-1.1 2.69-2.34 3.52v2.93h3.78c2.22-2.04 3.58-5.04 3.58-8.58z"/>
                                <path fill="#FBBC05" d="M5.34 14.28c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28l-3.86-3C.56 8.56 0 10.22 0 12s.56 3.44 1.48 5.28l3.86-3z"/>
                                <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.78-2.93c-1.05.7-2.4 1.13-4.18 1.13-3.13 0-5.73-2.55-6.66-5.52l-3.86 3C3.39 20.33 7.35 23 12 23z"/>
                            </svg>
                            <span>Google</span>
                        </button>
                        <button type="button" class="social-btn btn-facebook" onclick="handleSocialLogin('Facebook')">
                            <svg class="social-icon" viewBox="0 0 24 24" width="16" height="16" fill="#1877F2">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                            <span>Facebook</span>
                        </button>
                    </div>

                    <div class="mt-4 text-center" style="border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.25rem;">
                        <p style="font-size: 0.85rem; color: var(--text-muted);">
                            Already have an account? <a href="login.html"
                                style="color: var(--primary); font-weight: 600; text-decoration: none; transition: text-shadow 0.2s;"
                                onmouseover="this.style.textShadow='0 0 6px var(--neon-green-glow)'" 
                                onmouseout="this.style.textShadow=''">Login here</a>
                        </p>
                    </div>

                    <p id="errorMsg" class="badge badge-danger text-center mt-4 hidden"
                        style="display: block; width: 100%;"></p>
                </form>
                <div class="mt-3 text-center" style="font-size: 0.65rem; color: var(--text-muted); opacity: 0.6;">
                    SADIMS v1.0 | © 2026 Academic Use Only
                </div>
            </div>
        </div>
    </div>
    <script src="../services/api.js"></script>
    <script src="register.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        function handleSocialLogin(provider) {
            const errorMsg = document.getElementById('errorMsg');
            if (errorMsg) {
                errorMsg.textContent = `${provider} Secure Auth Handshake initiated. Action simulated for demo.`;
                errorMsg.style.borderColor = 'rgba(6, 182, 212, 0.4)';
                errorMsg.style.color = '#fff';
                errorMsg.style.background = 'rgba(6, 182, 212, 0.1)';
                errorMsg.style.boxShadow = '0 0 15px rgba(6, 182, 212, 0.15)';
                errorMsg.classList.remove('hidden');
                
                // Hide after 4 seconds
                setTimeout(() => {
                    errorMsg.classList.add('hidden');
                    // reset styles back to standard error red
                    errorMsg.style.borderColor = '';
                    errorMsg.style.color = '';
                    errorMsg.style.background = '';
                    errorMsg.style.boxShadow = '';
                }, 4000);
            }
        }
    </script>
</body>

</html>
