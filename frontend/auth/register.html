<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADIMS - Create Account</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-header">
                <h1>SADIMS</h1>
                <p>Smart Agriculture & Disease Management</p>
            </div>

            <div class="sd-card">
                <h3 class="mb-4 text-center" style="font-size: 1.5rem;">Create Account</h3>
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="sd-input" required placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="mobile">Mobile Number</label>
                        <input type="text" id="mobile" class="sd-input" required placeholder="Enter mobile number">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="sd-input" required placeholder="Create password">
                    </div>

                    <button type="submit" class="sd-btn sd-btn-primary" style="width: 100%; margin-top: 0.5rem;">
                        Register Now
                    </button>

                    <div class="mt-4 text-center">
                        <p style="font-size: 0.85rem; color: var(--text-muted);">
                            Already have an account? <a href="login.html"
                                style="color: var(--primary); font-weight: 600; text-decoration: none;">Login here</a>
                        </p>
                    </div>

                    <p id="errorMsg" class="badge badge-danger text-center mt-4 hidden"
                        style="display: block; width: 100%;"></p>
                </form>
                <div class="mt-4 text-center" style="font-size: 0.65rem; color: var(--text-muted); opacity: 0.6; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    SADIMS v1.0 | © 2026 Academic Use Only
                </div>
            </div>
        </div>
    </div>
    <script src="../services/api.js"></script>
    <script src="register.js"></script>
</body>

</html>
