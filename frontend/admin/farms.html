<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADIMS - Farm Holdings</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Persistent Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div
                    style="width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                    <i data-lucide="shield-check"></i>
                </div>
                <h2>SADIMS</h2>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Global Overview</span>
                </a>
                <a href="farmers.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Farmer Registry</span>
                </a>
                <a href="farms.html" class="nav-item active">
                    <i data-lucide="map"></i>
                    <span>Farm Holdings</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>AI Reports</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="nav-item" style="color: #FF8585;">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="page-title">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <a href="dashboard.html" style="color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-color); background: rgba(255,255,255,0.02); transition: all 0.3s ease;"><i data-lucide="arrow-left"
                                style="width: 16px;"></i></a>
                        <h2 style="font-size: 1.15rem; margin-left: 0.5rem;">Farm Holdings</h2>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 0.8rem; color: var(--neon-blue); font-weight: 600; filter: drop-shadow(0 0 6px var(--neon-blue-glow));">GLOBAL LAND REGISTRY</span>
                </div>
            </header>

            <div style="padding: 2.5rem;" class="p-4">
                <div class="sd-card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 28px; height: 28px; border-radius: 6px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); display: flex; align-items: center; justify-content: center; color: var(--neon-blue);">
                                <i data-lucide="map" style="width: 16px;"></i>
                            </div>
                            <h3 class="heading-font" style="font-size: 1.2rem; margin-bottom: 0;">Agricultural Portfolio</h3>
                        </div>
                        <div class="badge" style="background: rgba(59, 130, 246, 0.12); color: var(--neon-blue); border: 1px solid rgba(59, 130, 246, 0.2);"
                            id="farmCount">0 Fields</div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Farm Identity</th>
                                    <th>Legal Owner</th>
                                    <th>Geo Location</th>
                                    <th>Primary Crop</th>
                                    <th>Soil Profile</th>
                                </tr>
                            </thead>
                            <tbody id="farmsList">
                                <tr>
                                    <td colspan="5" class="text-center p-4" style="color: var(--text-muted);">Fetching
                                        agricultural data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../services/api.js"></script>
    <script src="farms.js"></script>
    <script>
        lucide.createIcons();
        function logout() {
            localStorage.removeItem('user');
            window.location.href = '../auth/login.html';
        }
    </script>
</body>

</html>
